name: Vercel container check

on:
  push:
    branches:
      - vercel-test
  pull_request:
    branches:
      - master

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Vercel container
        run: docker build -f Dockerfile.vercel -t cmms-legacy-vercel-test .
