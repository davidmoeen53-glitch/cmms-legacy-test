<%
require 'uri'

def database_config_from_url(name)
  url = ENV[name]
  raise "#{name} is not set" if url.nil? || url.empty?

  uri = URI.parse(url)
  {
    'adapter'  => (uri.scheme == 'postgres' ? 'postgresql' : uri.scheme),
    'encoding' => 'unicode',
    'database' => uri.path.sub(%r{^/}, ''),
    'pool'     => 5,
    'username' => uri.user,
    'password' => uri.password,
    'host'     => uri.host,
    'port'     => uri.port
  }
end

production_db = database_config_from_url('DATABASE_URL') if ENV['RAILS_ENV'] == 'production'
%>

development:
  adapter: postgresql
  encoding: unicode
  database: cmms
  pool: 5
  username: postgres
  password: 123456
  host: localhost
  port: 5432

production:
<% production_db.each do |key, value| %>
  <%= key %>: <%= value %>
<% end %>
  sslmode: require
