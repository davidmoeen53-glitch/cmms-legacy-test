<%
require 'uri'
require 'cgi'

def database_config_from_url(name)
  url = ENV[name]
  raise "#{name} is not set" if url.nil? || url.empty?

  uri = URI.parse(url)
  query = CGI.parse(uri.query.to_s)
  endpoint_id = uri.host.to_s.split('.').first

  options = query['options'] && query['options'].first
  if (options.nil? || options.empty?) && endpoint_id && !endpoint_id.empty?
    options = "endpoint=#{endpoint_id}"
  end

  {
    'adapter'  => (uri.scheme == 'postgres' ? 'postgresql' : uri.scheme),
    'encoding' => 'unicode',
    'database' => uri.path.sub(%r{^/}, ''),
    'pool'     => 5,
    'username' => uri.user,
    'password' => uri.password,
    'host'     => uri.host,
    'port'     => uri.port,
    'sslmode'  => (query['sslmode'] && query['sslmode'].first) || 'require',
    'options'  => options
  }.reject { |_, value| value.nil? || value.empty? }
end

production_db = database_config_from_url('DATABASE_URL') if ENV['RAILS_ENV'] == 'production'
%>

development:
  adapter: postgresql
  encoding: unicode
  database: cmms
  pool: 5
  username: postgres
  password: 123456
  host: localhost
  port: 5432

production:
<% production_db.each do |key, value| %>
  <%= key %>: <%= value %>
<% end %>
